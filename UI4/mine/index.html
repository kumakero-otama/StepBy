<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="mine.title">My contributions</title>
<meta name="theme-color" content="#2E9E8F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<script src="../js/config.js"></script>
<script src="../js/prefs.js"></script>
<script src="../i18n/dict.js"></script>
<style>
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-surface); }
  .tab {
    flex: 1; min-height: var(--tap-min);
    font-size: var(--fs-sm); font-weight: 600; color: var(--text-muted);
    border-bottom: 3px solid transparent;
    overflow-wrap: anywhere;
  }
  .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
</style>
</head>
<body data-nav="mine">

<a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to main content</a>

<div class="app-shell">
  <header class="app-bar" data-component="app-bar"
          data-title-key="mine.title" data-back="true" data-actions="settings"></header>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-reports"
            aria-selected="true" aria-controls="panel" data-i18n="mine.tab.reports">Reports</button>
    <button type="button" class="tab" role="tab" id="tab-routes"
            aria-selected="false" aria-controls="panel" data-i18n="mine.tab.routes">Routes</button>
  </div>

  <main class="app-main" id="main">
    <div id="panel" role="tabpanel" aria-labelledby="tab-reports"></div>
  </main>
</div>

<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/ui.js"></script>
<script>
(function (w, d) {
  'use strict';
  var api = w.StepByApi;
  var auth = w.StepByAuth;
  var ui = w.StepByUI;
  var i18n = w.StepByI18n;
  var t = w.t;

  if (!auth.isSignedIn()) { location.replace(auth.toApp('/login/')); return; }

  var panel = d.getElementById('panel');
  var tabs = { reports: d.getElementById('tab-reports'), routes: d.getElementById('tab-routes') };
  var active = 'reports';
  var cache = { reports: null, routes: null };

  function reportCard(item) {
    var href = auth.toApp('/detail/') + '?id=' + encodeURIComponent(item.id);
    var labels = item.tags.map(function (tag) { return i18n.tagLabel(tag); })
      .filter(Boolean).map(function (l) { return '<span class="chip">' + ui.esc(l) + '</span>'; }).join('');
    return '<a class="card" href="' + ui.esc(href) + '">' +
      '<div class="chip-set">' + (labels || '<span class="chip chip--muted">' + ui.esc(t('feed.noTags')) + '</span>') + '</div>' +
      (item.notes ? '<p class="card__title" style="margin-top:10px">' + ui.esc(item.notes) + '</p>' : '') +
      (item.createdAt ? '<p class="card__meta"><span>' + ui.esc(i18n.formatRelative(item.createdAt)) + '</span></p>' : '') +
      '</a>';
  }

  function routeCard(path) {
    var metres = Math.round(path.distanceM || path.lengthM || 0);
    return '<div class="card">' +
      '<p class="card__title">' + ui.esc(i18n.formatDate(path.startedAt || path.createdAt)) + '</p>' +
      '<p class="card__meta"><span>' + ui.esc(t('mine.routeLength', { n: i18n.formatNumber(metres) })) + '</span></p>' +
      (path.memo ? '<p class="text-sm text-muted" style="margin-top:8px">' + ui.esc(path.memo) + '</p>' : '') +
      '</div>';
  }

  function render() {
    var items = cache[active];
    if (!items) return;
    if (!items.length) {
      ui.emptyState(panel, { icon: 'inbox', title: t('mine.empty'), body: t('mine.emptyBody') });
      return;
    }
    panel.removeAttribute('aria-busy');
    panel.innerHTML = items.map(active === 'reports' ? reportCard : routeCard).join('');
  }

  async function load() {
    if (cache[active]) { render(); return; }
    ui.skeletonList(panel, 3);
    try {
      var centre = await w.StepByGeo.centre();
      if (active === 'reports') {
        cache.reports = await api.listReportsDetailed(
          { lat: centre.lat, lng: centre.lng, radiusKm: centre.radiusKm, mine: 1 },
          { onList: function (items) { cache.reports = items; render(); } }
        );
      } else {
        cache.routes = await api.listRecords(
          { lat: centre.lat, lng: centre.lng, radiusKm: centre.radiusKm, mine: 1 }
        );
      }
      render();
    } catch (err) {
      ui.errorState(panel, err, function () { cache[active] = null; load(); });
    }
  }

  function select(name) {
    active = name;
    Object.keys(tabs).forEach(function (key) {
      tabs[key].setAttribute('aria-selected', key === name ? 'true' : 'false');
    });
    panel.setAttribute('aria-labelledby', tabs[name].id);
    load();
  }

  tabs.reports.addEventListener('click', function () { select('reports'); });
  tabs.routes.addEventListener('click', function () { select('routes'); });

  /* Arrow-key navigation is expected of a tablist. */
  d.querySelector('[role="tablist"]').addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    var next = active === 'reports' ? 'routes' : 'reports';
    tabs[next].focus();
    select(next);
  });

  d.addEventListener('stepby:langchange', render);
  load();
})(window, document);
</script>
</body>
</html>
