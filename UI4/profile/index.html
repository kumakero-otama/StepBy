<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="profile.title">Profile</title>
<meta name="theme-color" content="#2E9E8F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<script src="../js/config.js"></script>
<script src="../js/prefs.js"></script>
<script src="../i18n/dict.js"></script>
<style>
  /* Hero, stats and menu follow UI1's profile screen. */
  .hero {
    margin: calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4)) 0;
    padding: var(--sp-6) var(--sp-5) var(--sp-5);
    background: var(--header-grad);
    color: #fff;
    text-align: center;
  }
  .hero img {
    width: 88px; height: 88px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto var(--sp-3);
    border: 3px solid rgba(255, 255, 255, 0.7);
    background: var(--bg-sunken);
  }
  .hero__name { font-size: var(--fs-lg); font-weight: 700; color: #fff; overflow-wrap: anywhere; }
  .hero__badges { display: flex; justify-content: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
  .badge {
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.28);
    font-size: var(--fs-xs);
    font-weight: 700;
  }
  .hero__edit {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    min-height: var(--tap-min);
    margin-top: var(--sp-4);
    padding: var(--sp-2) var(--sp-5);
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.9);
    color: var(--primary-dark);
    font-size: var(--fs-sm);
    font-weight: 700;
    text-decoration: none;
  }

  .stats { display: flex; gap: var(--sp-3); margin: var(--sp-4) 0; }
  .stat {
    flex: 1;
    padding: var(--sp-4) var(--sp-2);
    text-align: center;
    border-radius: var(--radius-md);
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .stat__value { font-size: var(--fs-xl); font-weight: 800; color: var(--primary-dark); }
  .stat__value small { font-size: var(--fs-sm); font-weight: 700; margin-inline-start: 2px; }
  .stat__label { margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--text-muted); overflow-wrap: anywhere; }

  .menu-row {
    display: flex; align-items: center; gap: var(--sp-3);
    width: 100%;
    min-height: 60px;
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: inherit;
    text-decoration: none;
    text-align: start;
  }
  .menu-row:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .menu-row:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }
  .menu-row + .menu-row { border-top: none; }
  .menu-row:active { background: var(--bg-sunken); }
  .menu-row__icon {
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: 10px;
    display: grid; place-items: center;
    color: #fff; font-size: 15px;
  }
  .menu-row__icon.purple { background: linear-gradient(135deg, #9B59B6, #8E44AD); }
  .menu-row__icon.teal   { background: linear-gradient(135deg, #2E9E8F, #3BB49F); }
  .menu-row__icon.blue   { background: linear-gradient(135deg, #4A90D9, #3B7DDD); }
  .menu-row__icon.orange { background: linear-gradient(135deg, #FFB847, #F5A623); }
  .menu-row__icon.red    { background: linear-gradient(135deg, #FF6B6B, #E74C3C); }
  .menu-row__text { flex: 1; min-width: 0; }
  /* Title above description, as in UI1 — they are spans, so make them blocks. */
  .menu-row__title { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text-strong); overflow-wrap: anywhere; }
  .menu-row__desc { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--text-muted); overflow-wrap: anywhere; }
  .menu-row__arrow { color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to main content</a>

<div class="app-shell">
  <header class="app-bar" data-component="app-bar"
          data-title-key="profile.title" data-actions="map,settings,profile"></header>

  <main class="app-main" id="main">

    <section class="hero">
      <img id="avatar" src="../assets/avatar-placeholder.svg" alt="">
      <div class="hero__name" id="username">…</div>
      <div class="hero__badges" id="badges"></div>
      <a class="hero__edit hidden" id="hero-edit" href="../profile-edit/">
        <span class="icon" data-icon="pen"></span>
        <span data-i18n="profile.editProfile">Edit profile</span>
      </a>
    </section>

    <p class="banner banner--info hidden" id="guest-banner" style="margin-top:16px">
      <span class="icon" data-icon="circle-info"></span>
      <span data-i18n="profile.guestNotice">You are browsing as a guest. Sign in to keep your contributions.</span>
    </p>

    <div class="stats">
      <div class="stat">
        <div class="stat__value" id="stat-distance">0.00<small>km</small></div>
        <div class="stat__label" data-i18n="profile.stat.tactile">Tactile paving recorded</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="stat-posts" data-i18n="profile.stat.postsValue" data-i18n-n="0">0</div>
        <div class="stat__label" data-i18n="profile.stat.roadPosts">Road reports posted</div>
      </div>
    </div>

    <!-- Same six rows as UI1, in the same order -->
    <nav aria-label="Profile menu">
      <a class="menu-row" href="../profile-edit/" id="row-edit">
        <span class="menu-row__icon teal"><span class="icon" data-icon="pen"></span></span>
        <span class="menu-row__text">
          <span class="menu-row__title" data-i18n="profile.editProfile">Edit profile</span>
          <span class="menu-row__desc" data-i18n="profile.editProfileDesc">Change your name and photo</span>
        </span>
        <span class="icon menu-row__arrow" data-icon="chevron-right"></span>
      </a>

      <a class="menu-row" href="../settings/#language">
        <span class="menu-row__icon blue"><span class="icon" data-icon="language"></span></span>
        <span class="menu-row__text">
          <span class="menu-row__title" data-i18n="settings.language">Language</span>
        </span>
        <span class="icon menu-row__arrow" data-icon="chevron-right"></span>
      </a>

      <a class="menu-row" href="../settings/#appearance">
        <span class="menu-row__icon orange"><span class="icon" data-icon="palette"></span></span>
        <span class="menu-row__text">
          <span class="menu-row__title" data-i18n="settings.appearance">Appearance</span>
          <span class="menu-row__desc" data-i18n="profile.appearanceDesc">Theme and text size</span>
        </span>
        <span class="icon menu-row__arrow" data-icon="chevron-right"></span>
      </a>

      <a class="menu-row" href="../help/">
        <span class="menu-row__icon teal"><span class="icon" data-icon="circle-question"></span></span>
        <span class="menu-row__text">
          <span class="menu-row__title" data-i18n="common.help">Help</span>
          <span class="menu-row__desc" data-i18n="profile.helpDesc">How to use it, and FAQs</span>
        </span>
        <span class="icon menu-row__arrow" data-icon="chevron-right"></span>
      </a>

      <button type="button" class="menu-row" id="signout-btn">
        <span class="menu-row__icon red"><span class="icon" data-icon="right-from-bracket"></span></span>
        <span class="menu-row__text">
          <span class="menu-row__title" data-i18n="profile.signOut">Sign out</span>
          <span class="menu-row__desc" data-i18n="profile.signOutDesc">Sign out of your account</span>
        </span>
      </button>

    </nav>

  </main>
</div>

<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/ui.js"></script>
<script>
(function (w, d) {
  'use strict';
  var api = w.StepByApi;
  var auth = w.StepByAuth;
  var ui = w.StepByUI;
  var i18n = w.StepByI18n;
  var t = w.t;

  var nameEl = d.getElementById('username');
  var badgesEl = d.getElementById('badges');
  var avatarEl = d.getElementById('avatar');
  var user = auth.getCachedUser();

  function paint() {
    var isGuest = !user || user.isGuest;
    nameEl.textContent = (user && user.username) || t('profile.guest');
    ui.setAvatar(avatarEl, user && user.iconUrl);

    /* PRO and distance pills, as on UI1's profile hero. */
    badgesEl.innerHTML = (user && user.isPro)
      ? '<span class="badge">' + ui.esc(t('profile.pro')) + '</span>'
      : '';

    d.getElementById('guest-banner').classList.toggle('hidden', !isGuest);
    d.getElementById('hero-edit').classList.toggle('hidden', isGuest);
    d.getElementById('row-edit').classList.toggle('hidden', isGuest);
    d.getElementById('signout-btn').classList.toggle('hidden', !auth.isSignedIn());

    paintStats();
  }

  /* Both figures come straight from /auth/me — no counting client-side. */
  function paintStats() {
    var metres = Number((user && user.totalTactileLength) || 0);
    var km = metres / 1000;
    /* Two decimals always, as UI1 shows it (0.00km). */
    d.getElementById('stat-distance').innerHTML =
      ui.esc(km.toLocaleString(i18n.locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 })) +
      '<small>km</small>';
    var posts = Number((user && user.totalRoadPosts) || 0);
    var postsEl = d.getElementById('stat-posts');
    postsEl.setAttribute('data-i18n-n', String(posts));
    postsEl.textContent = t('profile.stat.postsValue', { n: i18n.formatNumber(posts) });
  }

  async function load() {
    if (!auth.isSignedIn()) { paint(); return; }
    try {
      var res = await api.me();
      user = (res && res.user) || null;
      auth.setCachedUser(user);
    } catch (err) {
      if (err.status === 401) { location.replace(auth.toApp('/login/')); return; }
    }
    paint();

    /* PRO lives on its own endpoint; refresh the chip once we know. */
    user = Object.assign({}, user || {}, { isPro: await ui.fetchIsPro() });
    paint();
  }

  d.getElementById('signout-btn').addEventListener('click', async function () {
    var ok = await ui.confirmDialog({
      title: t('profile.signOutTitle'),
      body: t('profile.signOutBody'),
      confirmLabel: t('profile.signOut')
    });
    if (!ok) return;
    try { await api.signOut(); } catch (e) { /* clear locally regardless */ }
    auth.clearSession();
    location.replace(auth.toApp('/login/'));
  });

  d.addEventListener('stepby:langchange', paint);
  paint();
  load();
})(window, document);
</script>
</body>
</html>
