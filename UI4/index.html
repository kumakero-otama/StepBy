<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.name">StepBy</title>
<meta name="description" content="A community-built barrier-free walking map.">
<meta name="theme-color" content="#2E9E8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StepBy">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/components.css">
<script src="./js/config.js"></script>
<script src="./js/prefs.js"></script>
<script src="./i18n/dict.js"></script>
<style>
  .gate {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: var(--sp-5);
    background: linear-gradient(160deg, #14343F 0%, #2E9E8F 55%, #7FD6C6 100%);
  }
  .gate__box {
    width: 100%;
    max-width: 400px;
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    padding: var(--sp-6) var(--sp-5);
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .gate__mark {
    width: 68px; height: 68px;
    margin: 0 auto var(--sp-4);
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-bg);
    color: var(--accent-fg);
    font-size: 30px;
  }
  .gate__title { font-size: var(--fs-lg); margin-bottom: var(--sp-3); }
  .gate__body { color: var(--text-muted); margin-bottom: var(--sp-2); }
  .gate__emphasis { font-weight: 700; color: var(--danger); display: block; margin-bottom: var(--sp-5); }
  .gate__actions { display: flex; gap: var(--sp-2); }
  .gate__actions .btn { flex: 1; }
</style>
</head>
<body>

<main class="gate" id="gate">
  <!-- Consent step -->
  <section class="gate__box" id="step-consent" aria-labelledby="consent-title">
    <p class="gate__mark" aria-hidden="true"><span class="icon" data-icon="triangle-exclamation"></span></p>
    <h1 class="gate__title" id="consent-title" data-i18n="safety.title">Please check your surroundings</h1>
    <p class="gate__body" data-i18n="safety.body">Stay aware of traffic and people around you while using this app.</p>
    <strong class="gate__emphasis" data-i18n="safety.emphasis">Never use it while walking.</strong>
    <div class="gate__actions">
      <button type="button" class="btn btn--secondary" id="decline" data-i18n="safety.decline">Not now</button>
      <button type="button" class="btn btn--primary" id="accept" data-i18n="safety.accept">I understand</button>
    </div>
  </section>

  <!-- Declined step -->
  <section class="gate__box hidden" id="step-declined" aria-labelledby="declined-title">
    <p class="gate__mark" aria-hidden="true"><span class="icon" data-icon="person-walking"></span></p>
    <h1 class="gate__title" id="declined-title" data-i18n="safety.declinedTitle">Come back when it is safe</h1>
    <p class="gate__body" data-i18n="safety.declinedBody">Please close the app and open it again once you are somewhere safe.</p>
  </section>
</main>

<script src="./js/icons.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/auth.js"></script>
<script>
(function () {
  'use strict';
  var auth = window.StepByAuth;
  var CONSENT_KEY = 'stepby.safetyAck';

  function next() {
    /* A valid token means we can go straight to the map; otherwise sign in. */
    var target = auth.isSignedIn() && !auth.isTokenExpired() ? '/map/' : '/login/';
    location.replace(auth.toApp(target));
  }

  function acknowledged() {
    try { return sessionStorage.getItem(CONSENT_KEY) === '1'; } catch (e) { return false; }
  }

  if (acknowledged()) {
    next();
  } else {
    document.getElementById('accept').addEventListener('click', function () {
      try { sessionStorage.setItem(CONSENT_KEY, '1'); } catch (e) { /* private mode: ask again */ }
      next();
    });
    document.getElementById('decline').addEventListener('click', function () {
      document.getElementById('step-consent').classList.add('hidden');
      var declined = document.getElementById('step-declined');
      declined.classList.remove('hidden');
      declined.querySelector('h1').setAttribute('tabindex', '-1');
      declined.querySelector('h1').focus();
    });
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register(auth.toApp('/sw.js'), { scope: auth.toApp('/') })
        .catch(function () { /* offline support is optional */ });
    });
  }
})();
</script>
</body>
</html>
