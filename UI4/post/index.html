<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="post.titleNew">Add a report</title>
<meta name="theme-color" content="#2E9E8F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<script src="../js/config.js"></script>
<script src="../js/prefs.js"></script>
<script src="../i18n/dict.js"></script>
<style>
  #pick-map {
    height: 220px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: var(--sp-2);
  }
  .photo-item { position: relative; }
  .photo-item img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  .photo-item button {
    position: absolute; top: 4px; inset-inline-end: 4px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,0.65); color: #fff;
    display: grid; place-items: center; font-size: 12px;
  }
  .photo-add {
    display: grid; place-items: center; gap: 4px;
    aspect-ratio: 1;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: var(--fs-xs); font-weight: 600;
    text-align: center;
  }
  .photo-add .icon { font-size: 20px; }
  .submit-bar {
    position: sticky; bottom: 0;
    padding: var(--sp-3) 0 calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg-surface) 70%, transparent);
  }
</style>
</head>
<body data-nav="post">

<a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to main content</a>

<div class="app-shell">
  <header class="app-bar" data-component="app-bar"
          data-title-key="post.titleNew" data-back="true"></header>

  <main class="app-main" id="main">
    <form id="report-form" novalidate>

      <!-- Location ------------------------------------------------------ -->
      <section class="field" aria-labelledby="loc-heading">
        <h2 class="field__label" id="loc-heading" data-i18n="post.location">Location</h2>
        <div id="pick-map"></div>
        <p class="field__hint" data-i18n="post.locationHint">Drag the pin to the exact spot.</p>
        <p style="margin-top:8px">
          <button type="button" class="btn btn--secondary btn--block" id="use-current">
            <span class="icon" data-icon="location-crosshairs"></span>
            <span data-i18n="post.useCurrent">Use my current location</span>
          </button>
        </p>
      </section>

      <!-- Tags ---------------------------------------------------------- -->
      <section class="field" aria-labelledby="tags-heading">
        <h2 class="field__label" id="tags-heading" data-i18n="post.tags">What is here?</h2>
        <div class="chip-set" id="tag-set" role="group" aria-labelledby="tags-heading"></div>
        <p class="field__hint" data-i18n="post.tagsHint">Pick everything that applies.</p>
        <p class="field__error hidden" id="tags-error" data-i18n="post.tagsRequired">Please choose at least one tag.</p>
      </section>

      <!-- Notes --------------------------------------------------------- -->
      <section class="field">
        <label class="field__label" for="notes">
          <span data-i18n="post.notes">Notes</span>
          <span class="text-muted text-xs">(<span data-i18n="common.optional">Optional</span>)</span>
        </label>
        <textarea class="textarea" id="notes" maxlength="600"
                  placeholder="Anything that would help someone walking here…"
                  data-i18n-attr="placeholder:post.notesPlaceholder"></textarea>
      </section>

      <!-- Photos -------------------------------------------------------- -->
      <section class="field" aria-labelledby="photos-heading">
        <h2 class="field__label" id="photos-heading" data-i18n="post.photos">Photos</h2>
        <div class="photo-grid" id="photo-grid">
          <button type="button" class="photo-add" id="add-photo">
            <span class="icon" data-icon="camera"></span>
            <span data-i18n="post.addPhoto">Add photo</span>
          </button>
        </div>
        <input type="file" id="photo-input" accept="image/*" multiple class="sr-only"
               aria-label="Add photo" data-i18n-attr="aria-label:post.addPhoto">
        <p class="field__hint" id="photo-hint" data-i18n="post.photoLimit" data-i18n-n="4">You can attach up to 4 photos.</p>
      </section>

      <div class="submit-bar">
        <button type="submit" class="btn btn--primary btn--block" id="submit">
          <span class="icon" data-icon="check"></span>
          <span data-i18n="post.submit">Publish report</span>
        </button>
      </div>
    </form>
  </main>
</div>

<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/ui.js"></script>
<script src="./post.js"></script>
</body>
</html>
