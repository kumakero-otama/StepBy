<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.name">StepBy</title>
<meta name="theme-color" content="#2E9E8F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<script src="../js/config.js"></script>
<script src="../js/prefs.js"></script>
<script src="../i18n/dict.js"></script>
<style>
  /* The map screen owns the whole viewport: header, map, drawer, no scroll.
     The clipping lives on the map box, not the shell. */
  .app-shell { height: 100dvh; }
  .map-container { overflow: hidden; }
  /* Keep toasts above the drawer rather than on top of the layer cards. */
  body { --toast-offset: 300px; }

  /* ---- Wave separator, as in the original design ------------------------ */
  .header-wave {
    position: relative;
    height: 14px;
    flex-shrink: 0;
    background: var(--header-grad);
  }
  .header-wave svg {
    position: absolute;
    bottom: -1px; left: 0;
    width: 100%; height: 14px;
    display: block;
  }

  /* ---- Map -------------------------------------------------------------- */
  /* z-index makes this a stacking context, so Leaflet's own panes (400+) stay
     inside it instead of painting over the header and its dropdown. The
     original UI1 had this; dropping it is what cut the settings menu off. */
  .map-container { flex: 1; min-height: 0; position: relative; z-index: 1; }
  #map { width: 100%; height: 100%; background: var(--bg-sunken); }
  .leaflet-container { font-family: var(--font-sans); }
  .leaflet-control-zoom a {
    width: 40px; height: 40px; line-height: 40px;
    font-size: 20px;
    color: var(--text-strong);
    background: var(--bg-surface);
    border-color: var(--border);
  }

  .coords-strip {
    position: absolute;
    inset-inline: 0; top: 0;
    z-index: 350;
    display: flex;
    justify-content: space-between;
    gap: var(--sp-2);
    padding: 3px 12px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
  }
  .coords-strip span {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.75);
    font-variant-numeric: tabular-nums;
  }

  .map-notice {
    position: absolute;
    inset-inline: var(--sp-3);
    top: 24px;
    z-index: 400;
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--radius-sm);
    background: var(--accent-bg);
    color: var(--accent-fg);
    font-size: var(--fs-xs);
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  /* ---- Recorded-route detail sheet -------------------------------------- */
  .record-sheet__who {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    margin-bottom: var(--sp-3);
  }
  .record-sheet__who img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--bg-sunken); }
  .record-sheet__name { font-weight: 700; color: var(--text-strong); overflow-wrap: anywhere; }
  .record-sheet__when { font-size: var(--fs-xs); color: var(--text-muted); }
  .record-sheet__section { margin-top: var(--sp-4); }
  .record-sheet__section h3 { margin-bottom: var(--sp-2); color: var(--text-muted); font-size: var(--fs-xs); }
  .record-sheet__memo { white-space: pre-wrap; overflow-wrap: anywhere; }
  .record-sheet__owner { display: flex; gap: var(--sp-2); margin-top: var(--sp-5); }
  .record-sheet__owner .btn { flex: 1; }

  /* ---- Bottom drawer ---------------------------------------------------- */
  .drawer { flex-shrink: 0; position: relative; z-index: 100; }

  .record-state {
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4) 0;
    background: var(--bg-surface);
    font-size: var(--fs-xs); font-weight: 700;
    color: var(--danger);
  }
  .record-state__dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: currentColor;
    animation: recPulse 1.6s ease-in-out infinite;
  }
  .record-state.is-paused { color: var(--accent-fg); }
  .record-state.is-paused .record-state__dot { animation: none; }
  @keyframes recPulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

  .drawer__cta {
    display: flex;
    gap: 10px;
    padding: var(--sp-2) var(--sp-4);
    background: var(--bg-surface);
  }
  .btn-record {
    /* UI2 proportions: the primary action dominates. Pause is sized to its
       own label (flex-basis auto below) so it can never wrap onto two lines
       in any of the three languages. */
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    min-height: 58px;
    padding: 16px 18px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 4px 14px var(--primary-glow);
    transition: transform var(--dur-fast);
  }
  .btn-record .icon { font-size: 18px; }
  .btn-record:active { transform: scale(0.98); }
  .btn-record--secondary {
    flex: 0 1 auto;
    padding-inline: 14px;
    font-size: 15px;
    background: var(--bg-sunken);
    color: var(--text-muted);
    border: 1.5px solid var(--border);
    box-shadow: none;
  }
  .btn-record[disabled] { opacity: 0.55; pointer-events: none; }
  .btn-record.is-recording {
    background: linear-gradient(135deg, #FF6B6B, #E74C3C);
    box-shadow: 0 4px 16px rgba(231, 76, 60, 0.4);
  }
  .btn-record.is-paused {
    background: linear-gradient(135deg, var(--accent), #F5A623);
    color: #4A3400;
  }
  /* The pause button changes too, so "paused" is unmistakable wherever you
     are looking. */
  .btn-record--secondary.is-paused {
    background: var(--accent-bg);
    color: var(--accent-fg);
    border-color: var(--accent);
  }

  .drawer__handle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    min-height: 32px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-surface);
  }
  .drawer__handle .icon { font-size: 12px; }

  .drawer__content {
    overflow: hidden;
    padding: var(--sp-2) var(--sp-3) calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
    background: var(--bg-surface);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.08);
  }
  .drawer[data-open="false"] .drawer__content { display: none; }

  /* ---- Layer cards ------------------------------------------------------
     Two cards, not four: one switch turns on every map overlay, the other
     follows your position. Sized like UI2 now that there are only two. */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .layer-card {
    position: relative;
    min-width: 0;
    min-height: 92px;
    padding: 18px 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    background: var(--bg-raised);
    text-align: center;
    cursor: pointer;
    transition: border-color var(--dur-base), background var(--dur-base);
  }
  .layer-card input {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }

  /* Status dot only — same indicator as before, just on a bigger card. */
  .layer-card::after {
    content: '';
    position: absolute;
    top: 9px; inset-inline-end: 9px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
    transition: background var(--dur-base), box-shadow var(--dur-base);
  }
  .layer-card:has(input:checked)::after {
    background: var(--card-accent);
    box-shadow: 0 0 6px 2px var(--card-glow);
  }

  .layer-card:has(input:checked) {
    border-color: var(--card-accent);
    background: var(--card-bg);
  }
  .layer-card:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }

  .layer-card__icon {
    width: 40px; height: 40px;
    margin: 0 auto 8px;
    border-radius: 13px;
    display: grid; place-items: center;
    font-size: 19px;
    /* Its own tint, not --card-bg: when the card is selected those two were
       the same colour, the chip disappeared, and the two icons looked
       vertically misaligned even though they are not. */
    background: var(--card-chip);
    /* A defined edge in both states. Without it the chip on the selected card
       nearly matched that card's tint, so the eye read the small glyph there
       against the full 40 px chip on the other card — which looks like a
       misalignment even when the boxes are identical to the pixel. */
    border: 1px solid var(--card-edge);
    color: var(--card-accent);
  }
  .layer-card__title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text-strong);
    /* Hindi runs long; wrap rather than clip. */
    overflow-wrap: anywhere;
  }
  .layer-card:has(input:checked) .layer-card__title { color: var(--card-accent); }

  /* Underline that grows when the layer is on. */
  .layer-card__bar {
    position: absolute;
    bottom: 0; left: 50%;
    translate: -50% 0;
    width: 0; height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--card-accent);
    transition: width var(--dur-base) var(--ease-out);
  }
  .layer-card:has(input:checked) .layer-card__bar { width: 60%; }

  .layer-card--green {
    --card-accent: #2E9E5F; --card-bg: #E4F5EB;
    --card-chip: #CDEBDA; --card-edge: rgba(46,158,95,0.30); --card-glow: rgba(46,158,95,0.35);
  }
  .layer-card--teal {
    --card-accent: #2E9E8F; --card-bg: #E2F4F2;
    --card-chip: #C6E9E4; --card-edge: rgba(46,158,143,0.30); --card-glow: rgba(46,158,143,0.35);
  }

  :root[data-theme="dark"] .layer-card--green { --card-bg: #14301F; --card-chip: #1E4630; }
  :root[data-theme="dark"] .layer-card--teal  { --card-bg: #123330; --card-chip: #1B4A45; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .layer-card--green { --card-bg: #14301F; --card-chip: #1E4630; }
    :root:not([data-theme="light"]) .layer-card--teal  { --card-bg: #123330; --card-chip: #1B4A45; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#map" data-i18n="common.skipToContent">Skip to main content</a>

<div class="app-shell">

  <header class="app-bar" data-component="app-bar"
          data-title-key="app.name" data-tagline-key="app.brandTagline"
          data-brand="true" data-actions="map,settings,profile"></header>

  <div class="header-wave" aria-hidden="true">
    <svg viewBox="0 0 500 14" preserveAspectRatio="none">
      <path d="M0,0 C150,14 350,0 500,10 L500,14 L0,14 Z" fill="var(--bg-surface)"></path>
    </svg>
  </div>

  <div class="map-container">
    <div id="map" role="application" aria-label="Map" data-i18n-attr="aria-label:map.title"></div>

    <div class="coords-strip" aria-hidden="true">
      <span id="coords">Lat --, Lng --</span>
      <span id="last-updated">--:--:--</span>
    </div>

    <p class="map-notice hidden" id="map-notice" role="status" aria-live="polite"></p>
  </div>

  <!-- Bottom drawer: record actions above a collapsible row of layer cards -->
  <div class="drawer" id="drawer" data-open="true">
    <p class="record-state hidden" id="record-state" role="status" aria-live="polite">
      <span class="record-state__dot" aria-hidden="true"></span>
      <span id="record-state-text"></span>
    </p>

    <div class="drawer__cta">
      <button type="button" class="btn-record" id="btn-record">
        <span class="icon" data-icon="play"></span>
        <span data-i18n="map.recordStart">Start recording</span>
      </button>
      <button type="button" class="btn-record btn-record--secondary" id="btn-pause" disabled>
        <span class="icon" data-icon="pause"></span>
        <span data-i18n="map.recordPause">Pause</span>
      </button>
    </div>

    <button type="button" class="drawer__handle" id="drawer-handle"
            aria-expanded="true" aria-controls="drawer-content">
      <span class="icon" id="drawer-chevron" data-icon="chevron-down"></span>
      <span id="drawer-handle-label" data-i18n="map.drawerCollapse">Hide menu</span>
    </button>

    <div class="drawer__content" id="drawer-content">
      <div class="card-grid" role="group" aria-label="Map layers" data-i18n-attr="aria-label:map.layers">

        <label class="layer-card layer-card--green">
          <input type="checkbox" id="layer-map-info" checked>
          <span class="layer-card__icon" aria-hidden="true"><span class="icon" data-icon="globe"></span></span>
          <span class="layer-card__title" data-i18n="map.card.mapInfo">Map information</span>
          <span class="layer-card__bar" aria-hidden="true"></span>
        </label>

        <label class="layer-card layer-card--teal">
          <input type="checkbox" id="layer-follow">
          <span class="layer-card__icon" aria-hidden="true"><span class="icon" data-icon="crosshairs"></span></span>
          <span class="layer-card__title" data-i18n="map.card.follow">Centre on me</span>
          <span class="layer-card__bar" aria-hidden="true"></span>
        </label>

      </div>
    </div>
  </div>
</div>

<!-- PRO only: tags and a note captured when a recording is saved -->
<dialog class="sheet" id="pro-save" aria-labelledby="pro-save-title">
  <h2 id="pro-save-title" data-i18n="pro.saveTitle">Save this recording</h2>
  <p class="text-sm text-muted" data-i18n="pro.saveLead">Cancelling discards this recording.</p>

  <div class="record-sheet__section" id="pro-only-fields">
    <h3 data-i18n="pro.saveTags">What did you record?</h3>
    <div class="chip-set" id="pro-save-tags"></div>
    <p class="field__error hidden" id="pro-save-tags-error" data-i18n="pro.saveTagsRequired">Please choose at least one tag.</p>
  </div>

  <div class="record-sheet__section" id="pro-only-memo">
    <label class="field__label" for="pro-save-memo" data-i18n="pro.saveMemo">Note</label>
    <textarea class="textarea" id="pro-save-memo" maxlength="300"
              placeholder="Anything worth remembering about this route…"
              data-i18n-attr="placeholder:pro.saveMemoPlaceholder"></textarea>
  </div>

  <div class="sheet__actions">
    <button type="button" class="btn btn--danger" id="pro-save-cancel" data-i18n="pro.saveDiscard">Discard</button>
    <button type="button" class="btn btn--primary" id="pro-save-ok" data-i18n="pro.saveSubmit">Save</button>
  </div>
</dialog>

<!-- Details of a recorded route, opened by tapping its green line -->
<dialog class="sheet" id="record-sheet" aria-labelledby="record-sheet-title">
  <h2 id="record-sheet-title" data-i18n="record.title">Recorded route</h2>

  <div class="record-sheet__who">
    <img id="record-avatar" src="../assets/avatar-placeholder.svg" alt="">
    <div class="grow">
      <div class="record-sheet__name" id="record-name">…</div>
      <div class="record-sheet__when" id="record-when"></div>
    </div>
  </div>

  <div class="record-sheet__section">
    <h3 data-i18n="record.tags">Tags</h3>
    <div class="chip-set" id="record-tags"></div>
  </div>

  <div class="record-sheet__section">
    <h3 data-i18n="record.memo">Note</h3>
    <p class="record-sheet__memo" id="record-memo"></p>
    <div class="hidden" id="record-memo-edit">
      <label class="sr-only" for="record-memo-input" data-i18n="record.memo">Note</label>
      <textarea class="textarea" id="record-memo-input" maxlength="300"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="button" class="btn btn--secondary grow" id="record-memo-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="btn btn--primary grow" id="record-memo-save" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>

  <!-- Only shown to the person who recorded it -->
  <div class="record-sheet__owner hidden" id="record-owner-actions">
    <button type="button" class="btn btn--secondary" id="record-edit-memo">
      <span class="icon" data-icon="pen"></span>
      <span data-i18n="record.editMemo">Edit note</span>
    </button>
    <button type="button" class="btn btn--danger" id="record-delete">
      <span class="icon" data-icon="trash-can"></span>
      <span data-i18n="common.delete">Delete</span>
    </button>
  </div>

  <div class="sheet__actions">
    <button type="button" class="btn btn--secondary btn--block" id="record-close" data-i18n="common.close">Close</button>
  </div>
</dialog>

<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/mapprefs.js"></script>
<script src="../js/ui.js"></script>
<script src="./map.js"></script>
</body>
</html>
