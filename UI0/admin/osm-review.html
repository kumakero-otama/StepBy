<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StepBy OSM公開確認</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="../ui4-theme.css"><link rel="stylesheet" href="osm-review.css?v=20260829a"><style>:root body{margin:0!important;width:100%!important;max-width:none!important}#loading-overlay{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#102b27b8;color:#fff;font-size:1.05rem;backdrop-filter:blur(2px)}#loading-overlay[hidden]{display:none}.loading-spinner{width:52px;height:52px;border:6px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:review-spin .8s linear infinite}@keyframes review-spin{to{transform:rotate(360deg)}}</style></head>
<body><header><h1>OSM公開確認</h1><p>航空写真と記録経路を確認し、公開する記録だけを承認します。</p></header>
<main><section id="login"><h2>管理者ログイン</h2><div id="google-button"></div><p id="login-status"></p></section>
<section id="app" hidden><div class="toolbar"><input id="query" type="search" placeholder="記録者・記録IDを検索"><select id="source"><option value="all">新規・既存すべて</option><option value="new_record">新規記録</option><option value="legacy_record">既存記録</option></select><select id="status"><option value="pending">確認待ち</option><option value="held">保留</option><option value="approved">承認済み</option><option value="rejected">却下</option><option value="merge_failed">送信失敗</option><option value="merged">OSM公開済み</option><option value="all">すべて</option></select><label>開始<input id="from" type="date"></label><label>終了<input id="to" type="date"></label><button id="reload">検索・更新</button><button id="retry-notifications">通知再試行</button><strong id="result-count" aria-live="polite"></strong></div><div class="layout"><aside id="list"></aside><article><div id="decision-bar"><p>左の記録を選択してください。</p></div><div class="map-grid"><section><h3>航空写真</h3><div id="map"></div></section><section><h3>OpenStreetMap</h3><div id="osm-map"></div></section></div><div id="detail"></div></article></div></section><div id="loading-overlay" hidden role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><strong>最新のOSM情報を確認して公開しています。通常は1分以内に完了します…</strong></div></main>
<script src="../config.js"></script><script src="../auth/token_client.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="osm-review.js?v=20260901b"></script></body></html>
