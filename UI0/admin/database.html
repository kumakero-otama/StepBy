<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=https://stepby-api-8-229-191-182.sslip.io/admin/database.html">
  <title>StepBy 開発DB管理</title>
  <link rel="stylesheet" href="database.css?v=1.23.1">
  <link rel="stylesheet" href="../ui4-theme.css" />
</head>
<body>
  <main>
    <a href="../map/Index.html">← UI0へ戻る</a>
    <header>
      <p class="badge">UI0・開発DB限定</p>
      <h1>開発データベース確認</h1>
      <p>件数・容量・主要テーブルを読み取り専用で確認します。秘密情報を表示せず、本番DBには接続しません。</p>
    </header>

    <section class="card auth-card">
      <h2>管理者確認</h2>
      <label>開発管理者キー
        <input id="admin-key" type="password" autocomplete="off" placeholder="この画面内だけで使用">
      </label>
      <button id="load-overview" type="button">開発DBを読み込む</button>
      <p id="status" role="status">未読込</p>
    </section>

    <section id="overview" class="card hidden">
      <h2>DB概要</h2>
      <div id="database-summary"></div>
      <div id="table-cards" class="table-cards"></div>
    </section>

    <section id="table-view" class="card hidden">
      <div class="section-heading"><h2 id="table-title">テーブル内容</h2><button id="close-table" type="button">閉じる</button></div>
      <p class="warning">GPS座標を含む場合があります。この管理画面の内容を第三者へ共有しないでください。</p>
      <div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
    </section>

    <section id="experiment" class="card hidden">
      <h2>API作成・削除実験</h2>
      <p>開発DBの専用テーブルだけを対象に、1件作成して読み直し、削除します。OSM・本番DBには送信しません。</p>
      <label>ラベル<input id="experiment-label" value="管理画面からの開発DB試験"></label>
      <label>JSONデータ<textarea id="experiment-payload" rows="5">{"test":true,"source":"UI0 admin","osmSent":false}</textarea></label>
      <button id="create-experiment" type="button">開発DBへ試験データを作成</button>
      <div id="experiment-result"></div>
    </section>
  </main>
  <script src="../config.js?v=1.23.1"></script>
  <script src="../auth/token_client.js?v=1.23.1"></script>
  <script src="database.js?v=1.23.1"></script>
</body>
</html>
