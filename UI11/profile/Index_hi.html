<!doctype html>
<!-- このファイルは プロフィール画面のヒンディー語マークアップを定義する。 -->
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../language_redirect.js"></script>
    <title>प्रोफ़ाइल</title>
    <meta name="theme-color" content="#348f82" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="../appbar.css" />
    <link rel="stylesheet" href="profile.css?v=ui11-osm-oauth-20260804" />
    <link rel="stylesheet" href="../ui4-theme.css" />
  </head>
  <body>
    <header class="app-bar">
      <h1 class="app-bar-title">प्रोफ़ाइल</h1>
      <div class="app-bar-actions" aria-label="ऐप मेनू">
        <a class="app-bar-icon-link" href="../map/Index.html" aria-label="होम">
          <img src="../assets/buttons/map_white.png" alt="" />
        </a>
        <a class="app-bar-icon-link is-current" href="../profile/Index.html" aria-label="प्रोफ़ाइल">
          <img src="../assets/buttons/account.png" alt="" />
        </a>
        <a class="app-bar-icon-link" href="../setting/Index.html" aria-label="सेटिंग्स">
          <img src="../assets/buttons/setting.png" alt="" />
        </a>
      </div>
    </header>
    <div class="app-bar-spacer" aria-hidden="true"></div>

    <main class="profile-page">
      <section class="profile-card">
        <section class="profile-hero" aria-label="प्रोफ़ाइल सारांश">
          <div class="profile-hero-top">
            <div class="profile-avatar-wrap">
              <img
                id="profile-avatar"
                class="profile-avatar"
                src="../assets/account_default.png"
                alt="प्रोफ़ाइल आइकन"
              />
            </div>
          </div>

          <h2 id="profile-username" class="profile-username">username</h2>
          <script>
            (function () {
              // プロフィール画面表示時にキャッシュをできるだけ早くDOMに反映する先回り処理。
              // HTMLパース中にこの位置で実行されるため、profile.jsの実行を待たずに
              // キャッシュ済みのユーザー名・アイコンが初回ペイントから表示される。
              try {
                var raw = null;
                try { raw = window.localStorage && localStorage.getItem("cached_profile_user.v1"); } catch (e) {}
                if (!raw) {
                  try { raw = window.sessionStorage && sessionStorage.getItem("cached_profile_user.v1"); } catch (e) {}
                }
                if (!raw) return;
                var c = JSON.parse(raw);
                if (!c) return;
                if (c.username) {
                  var unEl = document.getElementById("profile-username");
                  if (unEl) unEl.textContent = c.username;
                }
                if (c.iconUrl) {
                  var avEl = document.getElementById("profile-avatar");
                  if (avEl) {
                    var src = c.iconUrl;
                    if (src.indexOf("http") !== 0) {
                      src = "https://stepby-api-8-229-191-182.sslip.io" + (src.indexOf("/") === 0 ? src : "/" + src);
                    }
                    // base64データURLでlocalStorageキャッシュ済みであればネットワークを経由せず即時表示する。
                    var iconRaw = null;
                    try { iconRaw = localStorage.getItem("cachedProfileIcon.v1"); } catch (e) {}
                    var usedDataUrl = false;
                    if (iconRaw) {
                      try {
                        var iconCache = JSON.parse(iconRaw);
                        if (iconCache && iconCache.url === src && iconCache.dataUrl) {
                          avEl.src = iconCache.dataUrl;
                          usedDataUrl = true;
                        }
                      } catch (e) {}
                    }
                    if (!usedDataUrl) {
                      avEl.src = src;
                    }
                  }
                }
              } catch (e) {}
            })();
          </script>
          <div class="profile-badge-row">
            <span id="profile-pro-chip" class="pro-badge hidden">PRO</span>
          </div>
          <button id="profile-edit-btn" class="profile-edit-btn" type="button">
            <img src="../assets/buttons/edit_white.png" alt="" />
            <span>प्रोफ़ाइल संपादित करें</span>
          </button>
        </section>

        <section class="stats-row" aria-label="उपलब्धियां">
          <article class="stat-card">
            <div class="stat-label">कुल स्पर्श मार्ग रिकॉर्ड</div>
            <div id="total-tactile-length" class="stat-value">0m</div>
          </article>
          <article class="stat-card">
            <div class="stat-label">कुल सड़क जानकारी पोस्ट</div>
            <div id="total-road-posts" class="stat-value">0</div>
          </article>
        </section>

        <section class="osm-connection-card" aria-labelledby="osm-connection-title">
          <div>
            <h2 id="osm-connection-title">OpenStreetMap पर प्रकाशन</h2>
            <p id="osm-connection-status" class="osm-connection-status">रिकॉर्ड की गई स्पर्शनीय फ़र्श जानकारी <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> में मर्ज की जाती है।</p>
          </div>
        </section>

        <div class="profile-wide-actions" aria-label="अतिरिक्त क्रियाएं">
          <a class="profile-wide-btn" href="../help/Index_hi.html">
            <span class="profile-wide-btn-icon profile-wide-btn-icon-help" aria-hidden="true">
              <img src="../assets/buttons/help_white.png" alt="" />
            </span>
            <span class="profile-wide-btn-body">
              <span class="profile-wide-btn-label">सहायता</span>
              <span class="profile-wide-btn-description">उपयोग विधि, FAQ, फ़ॉर्म आदि</span>
            </span>
          </a>
          <button id="profile-logout-btn" class="profile-wide-btn profile-wide-btn-danger" type="button">
            <span class="profile-wide-btn-icon profile-wide-btn-icon-logout" aria-hidden="true">
              <img src="../assets/buttons/logout_white.png" alt="" />
            </span>
            <span class="profile-wide-btn-body">
              <span class="profile-wide-btn-label">लॉग आउट</span>
              <span class="profile-wide-btn-description">अपने खाते से साइन आउट करें</span>
            </span>
          </button>
        </div>
      </section>
    </main>
    <script src="../config.js"></script>

    <script src="../auth/token_client.js"></script>
    <script src="profile.js?v=1.31.1-osm-publication-notice"></script>
    <script src="../pwa.js"></script>
  </body>
</html>
